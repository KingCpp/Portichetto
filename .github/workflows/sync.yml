name: Sincronizzazione Calendario Booking

on:
  schedule:
    - cron: '0 * * * *' # Gira automaticamente ogni ora (puoi modificare la frequenza a tuo piacimento)
  workflow_dispatch:      # Ti permette di lanciare lo script a mano da GitHub se hai fretta

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Scarica il codice dal tuo repository
    - name: Checkout del codice
      uses: actions/checkout@v4

    # 2. Configura Python sul server di GitHub
    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    # 3. Installa le librerie (requests e icalendar)
    - name: Installa dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Lancia lo script Python passando l'URL segreto
    - name: Esegui lo script di sincronizzazione
      env:
        BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
      run: python sync_calendar.py

    # 5. Se dates.json è cambiato, GitHub fa un commit e lo salva nel repository
    - name: Salva le modifiche nel repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add dates.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "auto: aggiornamento date calendario [skip netlify]" && git push)
